<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>에버랜드 행사 후기 평가</title>
<style>
  :root{
    --bg:#FFF7EC;
    --surface:#FFFFFF;
    --ink:#1F2A44;
    --muted:#7A7268;
    --accent:#FF6B35;
    --accent-dark:#E0501C;
    --line:#F0E6D8;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#241C14;
      --surface:#2E251A;
      --ink:#F5EFE6;
      --muted:#B8AA98;
      --line:#42362A;
    }
  }
  :root[data-theme="dark"]{
    --bg:#241C14;
    --surface:#2E251A;
    --ink:#F5EFE6;
    --muted:#B8AA98;
    --line:#42362A;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body{
    margin:0;
    min-height:100vh;
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .card{
    width:100%;
    max-width:420px;
    background:var(--surface);
    border-radius:20px;
    padding:32px 26px;
    box-shadow:0 10px 30px rgba(0,0,0,0.08);
    text-align:center;
    position:relative;
    overflow:visible;
  }
  .card h1{
    font-size:19px;
    margin:0 0 8px;
    line-height:1.4;
  }
  .card p.sub{
    font-size:13.5px;
    color:var(--muted);
    margin:0 0 4px;
    line-height:1.6;
  }
  .count-badge{
    display:inline-block;
    background:#FFF0E0;
    color:var(--accent-dark);
    font-size:12px;
    font-weight:700;
    padding:5px 12px;
    border-radius:999px;
    margin:14px 0 24px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]) .count-badge{
      background:#3A2A18;
      color:#FFB37A;
    }
  }
  :root[data-theme="dark"] .count-badge{
    background:#3A2A18;
    color:#FFB37A;
  }

  .scale{
    display:grid;
    grid-template-columns:repeat(5, 1fr);
    gap:10px;
    margin-bottom:8px;
    position:relative;
  }
  .score-btn{
    padding:14px 0;
    border-radius:12px;
    border:2px solid var(--line);
    background:var(--bg);
    color:var(--ink);
    font-size:16px;
    font-weight:700;
    cursor:pointer;
    position:relative;
    transition:transform 0.08s ease, border-color 0.15s ease;
  }
  .score-btn.dodge{
    transition:transform 0.55s cubic-bezier(.22,1.4,.36,1);
    z-index:5;
  }
  .score-btn.accept:hover{
    border-color:#2FA875;
    transform:translateY(-2px);
  }

  .score-labels{
    display:flex;
    justify-content:space-between;
    font-size:11.5px;
    color:var(--muted);
    margin:10px 2px 0;
  }

  .toast{
    position:absolute;
    left:50%;
    top:-14px;
    transform:translate(-50%, -100%);
    background:var(--ink);
    color:var(--surface);
    font-size:13px;
    font-weight:600;
    padding:10px 16px;
    border-radius:10px;
    white-space:nowrap;
    opacity:0;
    pointer-events:none;
    transition:opacity 0.18s ease, transform 0.18s ease;
    max-width:90%;
    overflow:hidden;
    text-overflow:ellipsis;
    z-index:20;
  }
  .toast.show{
    opacity:1;
    transform:translate(-50%, -115%);
  }

  .done{ padding:20px 0 6px; }
  .done .emoji{ font-size:48px; margin-bottom:12px; }
  .done h2{ font-size:18px; margin:0 0 8px; }
  .done p{ font-size:13.5px; color:var(--muted); margin:0; }
</style>
</head>
<body>

<div class="card" id="card">
  <div class="toast" id="toast"></div>
  <h1>에버랜드 행사, 완벽했다고 말해주세요!!!</h1>
  <p class="sub">솔직한 점수를 1~10점 사이에서 골라주세요 🙂</p>
  <p class="count-badge" id="countBadge"></p>

  <div class="scale" id="scale">
    <button class="score-btn dodge" data-score="1">1</button>
    <button class="score-btn dodge" data-score="2">2</button>
    <button class="score-btn dodge" data-score="3">3</button>
    <button class="score-btn dodge" data-score="4">4</button>
    <button class="score-btn dodge" data-score="5">5</button>
    <button class="score-btn dodge" data-score="6">6</button>
    <button class="score-btn dodge" data-score="7">7</button>
    <button class="score-btn dodge" data-score="8">8</button>
    <button class="score-btn accept" data-score="9">9</button>
    <button class="score-btn accept" data-score="10">10</button>
  </div>

  <div class="score-labels">
    <span>별로였어요</span>
    <span>최고였어요</span>
  </div>
</div>

<script type="module">
  import { db } from "./firebase-config.js";
  import {
    collection, addDoc, doc, onSnapshot, increment, setDoc, serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js";

  const card = document.getElementById('card');
  const scale = document.getElementById('scale');
  const toast = document.getElementById('toast');
  const countBadge = document.getElementById('countBadge');

  const dodgeMessages = {
    1: '정말 1점인가요?',
    2: '정말 2점인가요?',
    3: '정말 3점인가요?',
    4: '정말 4점인가요?',
    5: '정말 5점인가요?',
    6: '4점정도는 더 줘도 되지 않나요?',
    7: '3점 더주실 생각 없으신가요?',
    8: '2점더주셔도 티는 안나요?'
  };

  let attempts = [];
  let toastTimer = null;
  const returnTimers = new WeakMap();

  function showToast(text){
    toast.textContent = text;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 1400);
  }

  function dodge(btn){
    const score = Number(btn.dataset.score);

    const dx = (Math.random() - 0.5) * 140; // 좌우 최대 ±70px
    const dy = (Math.random() < 0.5 ? -1 : 1) * (30 + Math.random() * 40); // 위/아래 30~70px
    btn.style.transform = `translate(${dx}px, ${dy}px)`;

    showToast(dodgeMessages[score]);
    attempts.push(score);

    clearTimeout(returnTimers.get(btn));
    const t = setTimeout(() => {
      btn.style.transform = 'translate(0px, 0px)';
    }, 700);
    returnTimers.set(btn, t);
  }

  scale.querySelectorAll('.score-btn.dodge').forEach(btn => {
    btn.addEventListener('mouseenter', () => dodge(btn));
    btn.addEventListener('touchstart', (e) => { e.preventDefault(); dodge(btn); }, { passive: false });
    btn.addEventListener('click', (e) => { e.preventDefault(); dodge(btn); });
  });

  onSnapshot(doc(db, 'settings', 'reviewStats'), (snap) => {
    const count = snap.exists() && typeof snap.data().count === 'number' ? snap.data().count : 0;
    countBadge.textContent = `지금까지 ${count}명이 참여했어요`;
  });

  scale.querySelectorAll('.score-btn.accept').forEach(btn => {
    btn.addEventListener('click', async () => {
      const score = Number(btn.dataset.score);
      scale.querySelectorAll('.score-btn.accept').forEach(b => b.disabled = true);

      try {
        await addDoc(collection(db, 'reviews'), {
          finalScore: score,
          attemptCount: attempts.length,
          attemptHistory: attempts,
          submittedAt: serverTimestamp()
        });
        await setDoc(doc(db, 'settings', 'reviewStats'), {
          count: increment(1)
        }, { merge: true });
      } catch (err) {
        console.error('리뷰 저장 실패:', err);
      }

      card.innerHTML = `
        <div class="done">
          <div class="emoji">🎉</div>
          <h2>감사합니다!</h2>
          <p>${score}점이 접수되었습니다.</p>
        </div>`;
    });
  });
</script>
</body>
</html>
